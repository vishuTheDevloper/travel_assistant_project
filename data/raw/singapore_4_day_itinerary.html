<script>

    function buildBreadCrumbSchema() {
          const breadcrumbDiv = document.querySelector('.stb-breadcrumbs');
          const schema = {
          "@context": "https://schema.org/",
          "@type": "BreadcrumbList",
          "itemListElement": []
          };

          const items = breadcrumbDiv.getElementsByClassName('tw:items-center');
          Array.from(items).forEach((item, index) => {
          const link = item.querySelector('a');
          const textBlock = item.querySelectorAll('span')[1];
          const text = link ? link.textContent.trim() : textBlock.textContent.trim();
          const isLink = link && link.href;

          if (text !== '/') {
               const listItem = {
               "@type": "ListItem",
               "position": index + 1,
               "name": text
               };
               if (isLink) {
               listItem.item = link.href;
               } else {
               listItem.item = window.location.href; // Add current URL for non-link items
               }
               schema.itemListElement.push(listItem);
          }
          });

          return schema;
    }

    function initBreadCrumbSchema() {
        try {
            const breadcrumbDiv = document.querySelector('.stb-breadcrumbs');
            if (!breadcrumbDiv) return;
            const schema = buildBreadCrumbSchema();
            window.SchemaUtils.injectSchema(schema, "BreadcrumbList");

        }

            if (document.readyState === 'loading') {

            } else {
                run();
            }
        }
    })();
     
    
</script>

;:&#34;\u003cp\u003eFrom stunning traditional wares and unique souvenirs, this beloved store is your one-stop shop for discovering the rich tapestry of Peranakan culture.\u003c/p\u003e\r\n&#34;,&#34;tileImageAltText_t&#34;:&#34;Indulge in Peranakan culture at Kim Choo Kueh Chang shop&#34;,&#34;tileLinkUrl&#34;:&#34;https://www.visitsingapore.com/neighbourhood/featured-neighbourhood//katong-joo-chiat/kim-choo-kueh-chang/&#34;,&#34;ctaTarget&#34;:&#34;_self&#34;},{&#34;tilePillCategory&#34;:&#34;afternoon&#34;,&#34;tileImage&#34;:&#34;/content/dam/visitsingapore/travel-tips/Itineraries/4days-in-SG/Afternoon-Day2-Chinatown_746x560.jpg&#34;,&#34;tileTitle_t&#34;:&#34;Chinatown&#34;,&#34;tileDescription_t&#34;:&#34;\u003cp\u003eOnce a Chinese immigrant enclave, today\u0027s Chinatown is a mix of old and new, with historic temples alongside award-winning bars and restaurants.\u003c/p\u003e\r\n&#34;,&#34;tileImageAltText_t&#34;:&#34;Explore Chinatown for rich Chinese history and culture&#34;,&#34;tileLinkUrl&#34;:&#34;https://www.visitsingapore.com/neighbourhood/featured-neighbourhood/chinatown/&#34;,&#34;ctaTarget&#34;:&#34;_self&#34;},{&#34;tilePillCategory&#34;:&#34;afternoon&#34;,&#34;tileImage&#34;:&#34;/content/dam/visitsingapore/travel-tips/Itineraries/4days-in-SG/Afternoon-Day2-Maxwell-Food_746x560.jpg&#34;,&#34;tileTitle_t&#34;:&#34;Maxwell Food Centre &#34;,&#34;tileDescription_t&#34;:&#34;\u003cp\u003eVisit Maxwell Food Centre for local chicken rice from Tian Tian Hainanese Chicken Rice, and grab a cold glass of sugarcane juice to quench your thirst.\u003c/p\u003e\r\n&#34;,&#34;tileImageAltText_t&#34;:&#34;People enjoying food at \u0027Maxwell Food Centre\u0027&#34;,&#34;tileLinkUrl&#34;:&#34;https://chinatown.sg/dine/maxwell-hawker-centre/&#34;,&#34;ctaTarget&#34;:&#34;_blank&#34;},{&#34;tilePillCategory&#34;:&#34;afternoon&#34;,&#34;tileImage&#34;:&#34;/content/dam/visitsingapore/travel-tips/Itineraries/4days-in-SG/Afternoon-Day2-Relic-temple_746x560.jpg&#34;,&#34;tileTitle_t&#34;:&#34;Buddha Tooth Relic Temple &#34;,&#34;tileDescription_t&#34;:&#34;\u003cp\u003eContinue by foot and discover Chinatown\u0027s rich culture and history at the Buddha Tooth Relic Temple.\u003c/p\u003e\r\n&#34;,&#34;tileImageAltText_t&#34;:&#34;The Iconic Buddha Tooth Relic Temple&#34;,&#34;tileLinkUrl&#34;:&#34;https://www.visitsingapore.com/neighbourhood/featured-neighbourhood/chinatown/buddha-tooth-relic-temple/&#34;,&#34;ctaTarget&#34;:&#34;_self&#34;},{&#34;tilePillCategory&#34;:&#34;evening&#34;,&#34;tileImage&#34;:&#34;/content/dam/visitsingapore/travel-tips/Itineraries/4days-in-SG/Evening-Day2-Marina-Bay_746x560.jpg&#34;,&#34;tileTitle_t&#34;:&#34;Marina Bay&#34;,&#34;tileDescription_t&#34;:&#34;\u003cp\u003eAn iconic district, immerse in cityscape views, stunning architecture and trendy dining spots.\u003cbr /\u003e\r\n\u003c/p\u003e\r\n&#34;,&#34;tileImageAltText_t&#34;:&#34;Landscape view of Marina Bay&#34;,&#34;tileLinkUrl&#34;:&#34;https://www.visitsingapore.com/neighbourhood/featured-neighbourhood/marina-bay/&#34;,&#34;ctaTarget&#34;:&#34;_self&#34;},{&#34;tilePillCategory&#34;:&#34;evening&#34;,&#34;tileImage&#34;:&#34;/content/dam/visitsingapore/travel-tips/Itineraries/4days-in-SG/Evening-Day2-Shoppes-at-MarinaBay_746x560.jpg&#34;,&#34;tileTitle_t&#34;:&#34;The Shoppes at Marina Bay Sands&#34;,&#34;tileDescription_t&#34;:&#34;\u003cp\u003eWith over 170 luxury brands – from Tiffany \u0026amp; Co to Acne Studio\u0027s first-in-Asia store – The Shoppes at Marina Bay Sands is a great place to indulge in a bout of retail therapy.\u003c/p\u003e\r\n&#34;,&#34;tileImageAltText_t&#34;:&#34;The Shoppes at Marina Bay Sands&#34;,&#34;tileLinkUrl&#34;:&#34;https://www.visitsingapore.com/neighbourhood/featured-neighbourhood/marina-bay/marina-bay-sands/&#34;,&#34;ctaTarget&#34;:&#34;_self&#34;},{&#34;tilePillCategory&#34;:&#34;evening&#34;,&#34;tileImage&#34;:&#34;/content/dam/visitsingapore/travel-tips/Itineraries/4days-in-SG/red-house-seafood-746x560.jpg&#34;,&#34;tileTitle_t&#34;:&#34;Red House Seafood&#34;,&#34;tileDescription_t&#34;:&#34;\u003cp\u003eDig into a plate of chill crab – Singapore\u0027s most iconic seafood dish – and indulge in a variety of classic sharing dishes.\u003c/p\u003e\r\n&#34;,&#34;tileImageAltText_t&#34;:&#34;\u0027Chilli Crab\u0027, Singapore\u0027s iconic seafood dish&#34;,&#34;tileLinkUrl&#34;:&#34;https://www.redhouseseafood.com/&#34;,&#34;ctaTarget&#34;:&#34;_blank&#34;}]}'>

<stb-things-to-do aem-data='{&#34;header_t&#34;:&#34;Day 3: Be One with Nature (plus a spot of shopping)&#34;,&#34;description_t&#34;:&#34;&#34;,&#34;pills&#34;:[{&#34;pillLabel_t&#34;:&#34;Morning&#34;,&#34;pillCategory&#34;:&#34;morning&#34;},{&#34;pillLabel_t&#34;:&#34;Afternoon&#34;,&#34;pillCategory&#34;:&#34;afternoon&#34;},{&#34;pillLabel_t&#34;:&#34;Evening&#34;,&#34;pillCategory&#34;:&#34;evening&#34;}],&#34;tiles&#34;:[{&#34;tilePillCategory&#34;:&#34;morning&#34;,&#34;tileImage&#34;:&#34;/content/dam/visitsingapore/travel-tips/Itineraries/4days-in-SG/Day3-Morning-Botanic-Garden_746x560.jpg&#34;,&#34;tileTitle_t&#34;:&#34;Singapore Botanic Gardens&#34;,&#34;tileDescription_t&#34;:&#34;\u003cp\u003eEnjoy lush gardens, peace and tranquility at this 150-year-old green destination–which happens to be Singapore’s first UNESCO World Heritage Site.\u003c/p\u003e\r\n&#34;,&#34;tileImageAltText_t&#34;:&#34;Singapore Botanic Gardens, a world heritage site&#34;,&#34;tileLinkUrl&#34;:&#34;https://www.nparks.gov.sg/sbg&#34;,&#34;ctaTarget&#34;:&#34;_blank&#34;},{&#34;tilePillCategory&#34;:&#34;morning&#34;,&#34;tileImage&#34;:&#34;/content/dam/visitsingapore/travel-tips/Itineraries/4days-in-SG/Day3-Morning-Orchid-Garden_746x560.jpg&#34;,&#34;tileTitle_t&#34;:&#34;National Orchid Garden&#34;,&#34;tileDescription_t&#34;:&#34;\u003cp\u003eDon’t miss the National Orchid Garden, home to the largest orchid display in the world with over 60,000 plants and orchids on display.\u003cbr\u003e\r\n\u003c/p\u003e\r\n&#34;,&#34;tileImageAltText_t&#34;:&#34;National Orchid Garden, the largest orchid display&#34;,&#34;tileLinkUrl&#34;:&#34;https://sbg.nparks.gov.sg/attractions/national-orchid-garden/&#34;,&#34;ctaTarget&#34;:&#34;_blank&#34;},{&#34;tilePillCategory&#34;:&#34;morning&#34;,&#34;tileImage&#34;:&#34;/content/dam/visitsingapore/travel-tips/Itineraries/4days-in-SG/Day3-Morning-The Halia_746x560.jpg&#34;,&#34;tileTitle_t&#34;:&#34;The Halia &#34;,&#34;tileDescription_t&#34;:&#34;\u003cp\u003eBreak for brunch - located amidst the one-hectare Ginger Garden, this restaurant specialises in contemporary European cuisine.\u003c/p\u003e\r\n&#34;,&#34;tileImageAltText_t&#34;:&#34;\u0027The Halia\u0027 restaurant for contemporary European cuisine&#34;,&#34;tileLinkUrl&#34;:&#34;https://www.thehalia.com/&#34;,&#34;ctaTarget&#34;:&#34;_blank&#34;},{&#34;tilePillCategory&#34;:&#34;afternoon&#34;,&#34;tileImage&#34;:&#34;/content/dam/visitsingapore/travel-tips/Itineraries/4days-in-SG/Afternoon-Day3-Orchard-Road_746x560.jpg&#34;,&#34;tileTitle_t&#34;:&#34;Orchard Road&#34;,&#34;tileDescription_t&#34;:&#34;\u003cp\u003eSwitch up the pace – head to Singapore’s major shopping district, where you’ll find a mix of high-end brands, local labels, and everything in between.\u003c/p\u003e\r\n&#34;,&#34;tileImageAltText_t&#34;:&#34;Orchard Road of Singapore, a one stop shopping paradise&#34;,&#34;tileLinkUrl&#34;:&#34;https://www.visitsingapore.com/neighbourhood/featured-neighbourhood/orchard-road-backup/&#34;,&#34;ctaTarget&#34;:&#34;_self&#34;},{&#34;tilePillCategory&#34;:&#34;afternoon&#34;,&#34;tileImage&#34;:&#34;/content/dam/visitsingapore/travel-tips/Itineraries/4days-in-SG/Afternoon-Day3-Design-Orchard_746x560.jpg&#34;,&#34;tileTitle_t&#34;:&#34;Design Orchard &#34;,&#34;tileDescription_t&#34;:&#34;\u003cp\u003eExperience a curation of over 100 homegrown fashion and lifestyle labels, the largest one-stop destination to shop all things local.\u003c/p\u003e\r\n&#34;,&#34;tileImageAltText_t&#34;:&#34;\u0027Design Orchard\u0027, a one stop destination of local things&#34;,&#34;tileLinkUrl&#34;:&#34;https://www.visitsingapore.com/neighbourhood/featured-neighbourhood/orchard-road-backup/design-orchard/&#34;,&#34;ctaTarget&#34;:&#34;_self&#34;},{&#34;tilePillCategory&#34;:&#34;afternoon&#34;,&#34;tileImage&#34;:&#34;/content/dam/visitsingapore/travel-tips/Itineraries/4days-in-SG/Afternoon-Day3-Violet-Oon_746x560.jpg&#34;,&#34;tileTitle_t&#34;:&#34;Violet Oon &#34;,&#34;tileDescription_t&#34;:&#34;\u003cp\u003eTantalise your tastebuds with Peranakan cuisine. This homegrown dining is famous for serving up authentic dishes, from dry laksa to aromatic curries.\u003c/p\u003e\r\n&#34;,&#34;tileImageAltText_t&#34;:&#34;Violet Oon restaurant, a Peranakan cuisine heaven&#34;,&#34;tileLinkUrl&#34;:&#34;https://violetoon.com/violet-oon-singapore-at-ion-orchard/&#34;,&#34;ctaTarget&#34;:&#34;_blank&#34;},{&#34;tilePillCategory&#34;:&#34;evening&#34;,&#34;tileImage&#34;:&#34;/content/dam/visitsingapore/travel-tips/Itineraries/4days-in-SG/Evening-Day3-Bugis-Street_746x560.jpg&#34;,&#34;tileTitle_t&#34;:&#34;Bugis Street Market&#34;,&#34;tileDescription_t&#34;:&#34;\u003cp\u003eExplore Bugis, a district with a colorful past and is now known for its trendy stores. Find great bargains and more at Bugis Street Market.\u003c/p\u003e\r\n&#34;,&#34;tileImageAltText_t&#34;:&#34;Bugis Street Market of Singapore&#34;,&#34;tileLinkUrl&#34;:&#34;https://www.capitaland.com/sg/malls/bugis-street/en.html&#34;,&#34;ctaTarget&#34;:&#34;_blank&#34;},{&#34;tilePillCategory&#34;:&#34;evening&#34;,&#34;tileImage&#34;:&#34;/content/dam/visitsingapore/travel-tips/Itineraries/4days-in-SG/Evening-Day3-Little-India_746x560.jpg&#34;,&#34;tileTitle_t&#34;:&#34;Little India and Banana Leaf Apolo&#34;,&#34;tileDescription_t&#34;:&#34;\u003cp\u003eMake a beeline for the ethnic enclave Little India, and tuck into mouth-watering South Indian food such as popular local delicacy fish head curry at Banana Leaf Apolo.\u003c/p\u003e\r\n&#34;,&#34;tileImageAltText_t&#34;:&#34;Delicious ethnic cuisine at Little India \u0026 Banana Leaf Apolo&#34;,&#34;tileLinkUrl&#34;:&#34;https://www.visitsingapore.com/neighbourhood/featured-neighbourhood/little-india/&#34;,&#34;ctaTarget&#34;:&#34;_self&#34;},{&#34;tilePillCategory&#34;:&#34;evening&#34;,&#34;tileImage&#34;:&#34;/content/dam/visitsingapore/travel-tips/Itineraries/4days-in-SG/Evening-Day3-Mustafa-Centre_746x560.jpg&#34;,&#34;tileTitle_t&#34;:&#34;Mustafa Centre&#34;,&#34;tileDescription_t&#34;:&#34;\u003cp\u003eItching for more shopping options? Check out Mustafa Centre–a shopping complex that sells just about everything you can think of. Best of all, it’s open till late night.\u003c/p\u003e\r\n&#34;,&#34;tileImageAltText_t&#34;:&#34;Mustafa Centre Shopping Complex&#34;,&#34;tileLinkUrl&#34;:&#34;https://www.instagram.com/mustafacentre/?hl\u003den&#34;,&#34;ctaTarget&#34;:&#34;_blank&#34;}]}'>

34;tileImageAltText_t&#34;:&#34;Night Safari, worlds first nocturnal safari experience&#34;,&#34;tileLinkUrl&#34;:&#34;https://www.mandai.com/en/night-safari.html&#34;,&#34;ctaTarget&#34;:&#34;_blank&#34;}]}'>

    function waitForElementToExist(selector) {
      return new Promise((resolve) => {
        if (document.querySelector(selector)) {
          return resolve(document.querySelector(selector));
        }

        const observer = new MutationObserver(() => {
          if (document.querySelector(selector)) {
            resolve(document.querySelector(selector));

            observer.disconnect();
          }
        });

        observer.observe(document.body, {
          subtree: true,

          childList: true,
        });
      });
    }

<script>
    function itemListElement(sliders, pageType) {
        const dayItems = [];

        sliders.forEach((slider, index) => {
            let heading, description;

            // Extract heading and description based on pageType
            if(pageType === 'imageTextSlider') {
                const headerSection = slider.querySelector('div[class*="_content"]');
                heading = headerSection.querySelector('h2')?.textContent.trim() || '';
                description = headerSection.querySelector('p')?.textContent.trim() || '';
            } else if (pageType === 'sliders') {
                const descriptionContainer = slider.querySelector('div[class*="_description-container"]');
                heading = descriptionContainer?.querySelector('h2')?.textContent.trim() || '';
                const checkDescription = descriptionContainer?.querySelectorAll('div.rteContent').length;
                description = checkDescription > 1 ? descriptionContainer?.querySelectorAll('div.rteContent')[checkDescription - 1]?.textContent.trim() || '' : descriptionContainer?.querySelector('div.rteContent')?.textContent.trim() || '';
            } else if (pageType === 'thingsToDo') {
                const headerWrapper = slider.querySelector('div[class*="_headerWrapper"]');
                heading = headerWrapper?.querySelector('h2')?.textContent.trim() || '';
                description = ''; // Explicitly set to empty string if not applicable
            } else if (pageType === 'exploreMore') {
                const headerWrapper = slider.querySelector('div[class*="_contentWrapper"]');
                heading = headerWrapper?.querySelector('h2')?.textContent.trim() || '';
                description = headerWrapper?.querySelector('p')?.textContent.trim() || ''; 
            } else {
                const headerWrapper = slider.parentNode.parentElement?.closest('.containerComponent').previousElementSibling
                heading = headerWrapper?.querySelector('h2')?.textContent.trim() || '';
                description = '';
            }

            // Create a new dayItem object for each slider
            const dayItem = {
                "@type": "ListItem",
                "position": index + 1,
                "item": {
                    "@type": "ItemList",
                    "name": heading,
                    ...(description !== '' && { "description": description }),
                    "itemListElement": []
                }
            };

            // Extract tiles (excluding the view-all tile)     
            let tiles;
            if (pageType === "exploreMore") {
                const tileContainer = slider.querySelector('div[class*="_tile"]');
                tiles = tileContainer?.querySelectorAll(".motion-wrapper") ?? null;
            } 
            else if (pageType === "imageTextSlider") {
                tiles = slider.querySelectorAll('[data-item="detail-item"]');
            } 
            else if (pageType === "cardList") {
                tiles = slider.querySelectorAll(".card");
            } 
            else {
                tiles = slider.querySelectorAll(
                    'div[class*="_tile"]:not(div[class*="_tiles"]):not(div[class*="_view-all"]):not(div[class*="_tile-icon"])'
                );
            }
            
            tiles.forEach((tile, tileIndex) => {

                const tileHeader = pageType === 'imageTextSlider'? tile.querySelector('h3')?.textContent.trim() || '' : tile.querySelector('h4')?.textContent.trim() || '';
                let tileDescription = tile.querySelector('p')?.textContent.trim() || '';
                const pTags = tile.querySelectorAll('p');
                if (pTags.length > 0) {
                    tileDescription = pTags[pTags.length - 1].textContent?.trim();
                }

                dayItem.item.itemListElement.push({
                    "@type": "ListItem",
                    "position": tileIndex + 1,
                    "item": {
                        "@type": "TouristAttraction",
                        "name": tileHeader,
                        ...(tileDescription !== '' && { "description": tileDescription }),
                    }
                });
            });

            dayItems.push(dayItem);
        });

        return { dayItems };
    }

    function buildSchema() {
        const name        = window.SchemaUtils.getText(".imageandvideo h1");
        const description = window.SchemaUtils.getText(".imageandvideo p");
        const image       = window.SchemaUtils.getImageSrc(".imageandvideo img");
        const url         = location.href;

        const components = [
            { type: 'imageTextSlider', selector: 'stb-image-text-slider' },
            { type: 'sliders',         selector: 'stb-title-with-slider' },
            { type: 'thingsToDo',      selector: 'stb-things-to-do' },
            { type: 'exploreMore',     selector: 'stb-explore-more' },
            { type: 'cardList',        selector: '.cardlist' }
        ];

        const allDayItems = [];              

        components.forEach(({ type, selector }) => {
            const nodes = document.querySelectorAll(selector);

            if (nodes.length === 0) return;     
            const { dayItems } = itemListElement(nodes, type);

            if (Array.isArray(dayItems) && dayItems.length) {
                allDayItems.push(...dayItems);
            }
        });

        return {
            "@context": "https://schema.org",
            "@type": "TouristTrip",
            name,
            description,
            url,
            image,
            itinerary: {
                "@type": "ItemList",
                itemListElement: allDayItems     
            }
        };
    }

    function initItinerarySchema() {
        try {
            const schema = buildSchema();
            window.SchemaUtils.injectSchema(schema, "TouristTrip");
        } catch (error) {
            console.error("Failed to generate Itinerary schema:", error);
        }
    }


    (function () {
        if (isTranslationPage()) {
            window.registerTranslationComplete(initItinerarySchema);
        } else {
            const run = () => setTimeout(initItinerarySchema, 300);
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', run);
            } else {
                run();
            }
        }
    })();


    //window.addEventListener("DOMContentLoaded", initItinerarySchema);
</script>
